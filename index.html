<!-- defines the structure and the content of the webpage -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1">
    <title>Load Shedding Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="power-grid.ico" type="image/x-icon"> 
</head>
<body>
    <div class="container">
    <h1>Load Shedding Simulator</h1>

    <div class="capacity-group">
        <label>Grid Capacity (MW)</label>
        <input type="number" id="capacity">
    </div>
    <h3>Loads</h3>
    <div id="loads"></div>

    <div class="buttons">
        <button class="add-btn" onclick="addLoad()">Add Load</button>
        <button class="sim-btn" onclick="simulate()">Simulate</button>
    </div>

    <h3>Result</h3>
    <pre id="result"></pre>

    <script src="script.js"></script>
    </div>
</body>
</html>
